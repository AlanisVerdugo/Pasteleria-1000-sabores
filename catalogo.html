
<!-- Estructura basica HTML5 -->
<!doctype html>
<!-- Indica que el contnido está en español -->
<html lang="es">
  <!-- Cosas que el navegador necesita para mostrar la página, bootstrap -->
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport para asegurar que la página se muestre correctamente en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título de la página en la pestaña del navegador -->
    <title>Catálogo - Pastelería 1000 Sabores</title>

    <!-- Link que da acceso a todas las clases de Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- link para la fuente Pacifico y Source Sans 3, la cursiva -->
      <!-- Le avisa al navegador con anticipacion que se va a conectar a fonts.googleapis.com, asi ahorra tiempo cuando llegue el link de abajo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Importa las 2 fuentes que se usan: Pacifico (para títulos cursivos) y Source Sans 3 en 3 pesos distintos (400 normal, 600 semi-negrita, 700 negrita) para el texto del body -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- link para los iconos de Bootstrap, carrito, persona, lupa -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- link para los estilos personalizados en CSS local, el de nosotros -->
    <link rel="stylesheet" href="css/estilos.css">
    <!-- link para los estilos específicos del catálogo -->
     <!-- Va al final para poner primero los bootstrap y luego el nuestro -->
    <link rel="stylesheet" href="css/catalogo.css">
  <!-- Cierre del head, lo demas es visible -->
  </head>


  <body>

    <!-- CABECERA -->
    <header>
      <!-- navbar-expand-lg: se expande en pantallas ≥992px, se colapsa en hamburguesa antes de eso -->
      <nav class="navbar navbar-expand-lg">
        <!-- "container" en vez de "container-fluid px-4". "container" tiene un ancho máximo y se centra, así el navbar queda alineado con el resto del contenido de la página en vez de ir de borde a borde -->
        <div class="container">
          <!-- el tamaño (2.8rem), la fuente Pacifico y el color café están definidos en cabecera.css, en la regla .navbar-brand -->
          <a class="navbar-brand" href="home.html">Pastelería 1000 Sabores</a>
          <!-- El botón hamburguesa -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Bootstrap maneja el espaciado por defecto -->
          <div class="collapse navbar-collapse" id="navbarNav">
            <!-- "mb-2 mb-lg-0": margen abajo SOLO en pantallas chicas (para separar del botón hamburguesa cuando el menú está colapsado), que desaparece (mb-lg-0) en pantallas grandes donde ya no hace falta -->
            <ul class="navbar-nav nav-underline mx-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
              <!-- "active" va en Catálogo, no en Home -->
              <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
              <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
              <li class="nav-item"><a class="nav-link" href="quienes_somos.html">Quiénes Somos</a></li>
            </ul>
            <!-- "align-items-center" para que los 2 iconos queden centrados verticalmente entre sí -->
            <div class="d-flex gap-3 align-items-center">
              <!-- el href apunta a "registro.html" y se agregó la clase "icono-header". bi bi: icono de persona-->
              <a href="registro.html" class="icono-header"><i class="bi bi-person"></i></a>
              <a href="carrito.html" class="icono-header"><i class="bi bi-cart"></i></a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- MAIN-->
    <main>
      <!-- Contenido unico de esta pagina, diferente al header o footer -->
       <!-- section: bloque tematico dentro de main, es "la zona de titulo + buscador" -->
      <!-- contaniner: a diferencia del container-fluid de navbar que ocupaba el 100% del ancho, este si tiene margenes -->
      <section class="container py-5">

        <!-- Aqui pondremos el titulo a la izq y el buscador a la derecha en la misma fila -->
        <!-- d-flex: para crear una fila flexible. flex-wrap: para que se ajuste solo si yo quiero ajustar la pagina -->
        <!-- justify-content-between: para que el titulo y el buscador se coloquen al inicio y final de la fila -->
        <!-- align-items-start: para que los elementos se alineen por su borde superior -->
        <!-- mb-4: margin bottom 4 -->
        <div class="d-flex flex-wrap justify-content-between align-items-start mb-4">
          <div>
            <!-- H1: tTITULO PRINCIPAL DE LA PAGINA -->
            <h1 style="font-family:'Caveat',cursive; color:#7B4B2A;">Nuestro Catálogo</h1>
            <p class="text-muted">Descubre la tradición en cada bocado.</p>
          </div>
          <!-- BUSCADOR -->
           <!-- input-group es de bootstrap para pegar un icono a un campo de texto. style: tamaño del buscador -->
          <div class="input-group" style="max-width:350px;">
            <!-- input: bootstrap le da el borde y padding de la cajita. bg: fondo blanco. bi bi: dibuja la lupita -->
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <!-- input text: campo de texto estandar. form: estilo bootstrap. placeholder: texto gris que desaparece cuando el usuario escribe -->
            <input type="text" class="form-control" placeholder="Buscar productos...">
          </div>
        </div>

        <!-- FILTROS Y GRILLA DE PRODUCTOS -->
         <!-- row: fila de bootstrap (abre la fila de 12 columnas), bootstrap --> 
        <div class="row">
          <!-- Columna izquierda: panel de filtros -->
          <!-- aside es que se ubica a un lado del contenido principal -->
          <aside class="col-lg-3 mb-4">
            <!-- Farjeta blanca que envuelve todo el panel de filtros. p-4: padding de 4 -->
            <div class="bg-white rounded-4 p-4 shadow-sm">
              <!-- Fila que pone el titulo "Filtros" a la izquierda y "Limpiar" a la derecha, separados al máximo -->
              <div class="d-flex justify-content-between align-items-center mb-3">
                <!-- Titulo del panel. mb-0 le quita el margen inferior que trae un <h5> por defecto -->
                <h5 class="mb-0" style="color:#7B4B2A;">Filtros</h5>
                <!-- Link limpiar -->
                <a href="#" class="small text-muted text-decoration-none">
                  <!-- Icono de x de bootstrap -->
                  <i class="bi bi-x-lg"></i> Limpiar
                </a>
              </div>

              <!-- Etiqueta pequeña en mayúsculas que anuncia la sección "CATEGORIAS" -->
              <p class="text-uppercase small text-muted mb-2">Categorías</p>

              <!-- Contenedor del par checkbox+texto; mb-2 separa cada fila de la siguiente -->
              <div class="form-check mb-2">
                <!-- El checkbox real. El id es lo que lo conecta con su <label> de abajo -->
                <input class="form-check-input" type="checkbox" id="catTortasCuadradas">
                <!-- El texto clickeable; "for" debe ser IGUAL al "id" del input de arriba, así hacer clic en el texto también marca el checkbox -->
                <label class="form-check-label" for="catTortasCuadradas">Tortas Cuadradas</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="catCirculares">
                <label class="form-check-label" for="catCirculares">Circulares</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="catPostres">
                <label class="form-check-label" for="catPostres">Postres Individuales</label>
              </div>
              <div class="form-check mb-2">
                <!-- checked es para que aparezca marcado por defecto -->
                <input class="form-check-input" type="checkbox" id="catSinAzucar" checked>
                <label class="form-check-label" for="catSinAzucar">Sin Azúcar</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="catVegana" checked>
                <label class="form-check-label" for="catVegana">Vegana</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="catSinGluten">
                <label class="form-check-label" for="catSinGluten">Sin Gluten</label>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="catEspeciales">
                <label class="form-check-label" for="catEspeciales">Especiales</label>
              </div>

              <!-- Etiqueta pequeña en mayúsculas que anuncia la sección "FORMA" -->
              <p class="text-uppercase small text-muted mb-2">Forma</p>

              <!-- Fila con los dos botones de forma, con espacio (gap) entre ellos -->
              <div class="d-flex gap-2 mb-3">
                <!-- Boton outline (sin relleno) tamaño chico, forma de píldora -->
                <button class="btn btn-outline-secondary btn-sm rounded-pill">Cuadrada</button>
                <!-- Mismo estilo de boton -->
                <button class="btn btn-outline-secondary btn-sm rounded-pill">Circular</button>
              </div>

              <!-- Etiqueta de la sección "TAMAÑO (PERSONAS)" -->
              <p class="text-uppercase small text-muted mb-2">Tamaño (Personas)</p>
              <!-- Checkbox de tamaño, mismo patrón que los de categorías -->
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="tam1">
                <label class="form-check-label" for="tam1">1 Persona</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="tam15">
                <label class="form-check-label" for="tam15">15 Personas</label>
              </div>
              <!-- Último de la lista, sin mb-2 porque no necesita separación de nada más abajo -->
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="tam20">
                <label class="form-check-label" for="tam20">20 Personas</label>
              </div>
            <!-- cierre de la caja blanca del panel -->
            </div>
          </aside>

          <!-- Columna derecha: grilla de productos -->
          <div class="col-lg-9">
            <!-- Barra "Mostrando X productos / Ordenar por": misma fila blanca con padding y sombra que el panel de filtros -->
            <div class="d-flex justify-content-between align-items-center bg-white rounded-4 p-3 mb-4 shadow-sm">

              <!-- Texto fijo con el número de productos en negrita -->
              <span>Mostrando <strong>5</strong> productos</span>

              <!-- Agrupa el texto "Ordenar por:" y el desplegable en una fila -->
              <div class="d-flex align-items-center gap-2">
                <!-- Texto gris secundario -->
                <span class="text-muted small">Ordenar por:</span>
                <!-- Menú desplegable; form-select-sm = versión chica; border-0 = sin borde, se ve "flotando" -->
                <select class="form-select form-select-sm border-0" style="color:#7B4B2A; font-weight:600;">
                  <!-- Primera opción, la que se muestra por defecto -->
                  <option>Recomendados</option>
                  <!-- Otra opción posible del desplegable -->
                  <option>Precio: menor a mayor</option>
                  <!-- Otra opción posible -->
                  <option>Precio: mayor a menor</option>
                </select>
              </div>
            <!-- Cierra la barra de "Mostrando X productos" -->
            </div>
            
            <!-- Grilla de cards: 1 columna en mobile, 2 en tablet (md), 3 en pantallas extra grandes (xl); g-4 = espacio entre cards -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
              <!-- Aquí van las cards de productos: Paso 5 -->
            </div>
          </div>
        </div>

  </body>
</html>
